<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSBN.ir | Test Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      width: min(90%, 620px);
      padding: 42px 32px;
      text-align: center;
      border: 1px solid #334155;
      border-radius: 20px;
      background: #1e293b;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .ok {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #16a34a;
      color: white;
      font-size: 38px;
      font-weight: bold;
    }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { color: #94a3b8; line-height: 1.9; }
    .domain {
      direction: ltr;
      margin: 24px 0;
      padding: 14px;
      border-radius: 10px;
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 18px;
    }
    .status {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #14532d;
      color: #bbf7d0;
    }
    small { display: block; margin-top: 24px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="ok">✓</div>
    <h1>سایت با موفقیت متصل شد!</h1>
    <p>اگر این صفحه را می‌بینی، GitHub Pages و دامنه سفارشی به‌درستی کار می‌کنند.</p>
    <div class="domain">csbn.ir</div>
    <div class="status">DNS + GitHub Pages OK</div>
    <small>Test page • CSBN.ir</small>
  </main>
</body>
</html>
